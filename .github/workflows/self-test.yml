name: self-test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Watch two pages
        id: watch
        uses: ./
        with:
          urls: |
            https://example.com/
            https://oracle.saltcrate.com/
          report-changes-only: "false"
      - name: Assert outputs exist
        run: |
          echo "checked=${{ steps.watch.outputs.checked-count }}"
          test "${{ steps.watch.outputs.checked-count }}" = "2"
      - name: Second pass should be unchanged (stateful check)
        uses: ./
        with:
          urls: https://example.com/
